[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartgate"
version = "0.1.0"
description = "Decision friction and a human override for AI agents: score each action, ask a person before risky ones, kill any action or agent with one logged call."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartgate", "agents", "kill-switch", "human-in-the-loop", "guardrails", "approval"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartgate"
Issues = "https://github.com/SmartTasksOrg/sf-smartgate/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartgate/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartgate/blob/main/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartgate = "sf_smartgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_smartgate = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
